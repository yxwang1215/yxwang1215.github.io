<!-- Knowledge transfer: a looping curve rather than a one-way arrow. -->
<path d="M1091 459 C1155 382 1260 402 1322 476" fill="none" stroke="#a77748" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 13" opacity=".7"/>
<path d="M1310 449 L1326 481 L1293 478" fill="none" stroke="#a77748" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".74"/>
<path d="M1252 469 C1191 428 1112 433 1082 479" fill="none" stroke="#83948b" stroke-width="3.5" stroke-dasharray="7 14" opacity=".48"/>
<g fill="#b88f60"><circle cx="1193" cy="426" r="7"/><circle cx="1153" cy="430" r="4"/></g>

<!-- Distinctive small index at the lower edge. -->
<g font-family="Arial, sans-serif" fill="#f9ecda" letter-spacing="3" font-size="17" opacity=".82">
<text x="1402" y="866">VOL. 10 / 2026</text>
</g>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-desc">
<title id="cover-title">The Art of Teaching and Learning</title>
<desc id="cover-desc">A warm editorial illustration: a study desk, open notebooks, two abstract teacher-and-student figures, and a looping path of ideas. Cream parchment, muted olive, ink blue and copper.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset=".53" stop-color="#f1eadc"/><stop offset="1" stop-color="#d6c5ad"/></linearGradient>
  <linearGradient id="sunlight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbef" stop-opacity=".8"/><stop offset="1" stop-color="#efca93" stop-opacity=".12"/></linearGradient>
  <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b99369"/><stop offset="1" stop-color="#745a48"/></linearGradient>
  <linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e7d7b9"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6dcac" stop-opacity=".86"/><stop offset="1" stop-color="#e2b67f" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="185%"><feDropShadow dx="0" dy="19" stdDeviation="21" flood-color="#574636" flood-opacity=".18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="37"/></filter>
  <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1" fill="#62472e" opacity=".1"/><circle cx="49" cy="58" r=".8" fill="#62472e" opacity=".11"/><circle cx="80" cy="21" r=".9" fill="#fff" opacity=".35"/></pattern>
  <clipPath id="art"><rect x="0" y="0" width="1600" height="900"/></clipPath>
</defs>
<g clip-path="url(#art)">
<rect width="1600" height="900" fill="url(#paper)"/>
<rect width="1600" height="900" fill="url(#grain)"/>
<path d="M880 -80 L1110 -80 L1515 545 L1310 600Z" fill="url(#sunlight)" opacity=".58"/>
<path d="M1150 -80 L1295 -80 L1690 585 L1543 585Z" fill="#fff8e7" opacity=".28"/>
<circle cx="1240" cy="330" r="415" fill="url(#halo)" opacity=".82"/>
<circle cx="1648" cy="-38" r="320" fill="#cfbca3" opacity=".25"/>
<path d="M813 82 V815" stroke="#d4c4ad" stroke-width="2" opacity=".55"/>

<!-- Editorial title: left column intentionally uncluttered. -->
<g font-family="Arial, Helvetica, sans-serif">
<text x="104" y="117" font-size="23" letter-spacing="8" fill="#6c796e" font-weight="600">JOURNAL</text>
<path d="M270 109 H386" stroke="#bd9f76" stroke-width="2"/>
<text x="105" y="190" font-size="19" letter-spacing="4.5" fill="#847767">RESEARCH NOTES  /  29 OCT 2026</text>
</g>
<g fill="#24343a" font-family="Georgia, 'Times New Roman', serif">
<text x="99" y="346" font-size="100" letter-spacing="-3">The art of</text>
<text x="99" y="461" font-size="113" letter-spacing="-5" font-style="italic">teaching</text>
<text x="99" y="580" font-size="105" letter-spacing="-4">&amp; learning.</text>
</g>
<path d="M104 632 H557" stroke="#b4895c" stroke-width="4" stroke-linecap="round"/>
<g fill="#495c5b" font-size="29" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">
<text x="104" y="710">Student 如何向 Teacher 学习？</text>
<text x="104" y="763" fill="#827768" font-size="23" letter-spacing="2">SFT · OPD · SKILLS · EDUCATION</text>
</g>

<!-- Background chalk annotations, deliberately light. -->
<g font-family="Georgia, serif" font-size="22" font-style="italic" fill="#9a8b76" opacity=".7">
<text x="941" y="132">question</text>
<text x="1315" y="154">guidance</text>
<text x="1189" y="264">reflection</text>
<text x="1390" y="412">practice</text>
</g>
<g fill="none" stroke="#a98d69" stroke-width="2.5" opacity=".41">
<path d="M980 155 C1080 88 1208 113 1244 202" stroke-dasharray="7 10"/>
<path d="M1345 180 C1418 258 1389 339 1322 369" stroke-dasharray="7 10"/>
<path d="M1211 266 C1125 283 1079 321 1042 389" stroke-dasharray="7 10"/>
<circle cx="1244" cy="204" r="5" fill="#c6a277"/>
<circle cx="1320" cy="369" r="5" fill="#c6a277"/>
</g>


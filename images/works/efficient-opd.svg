<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="efficient-opd-title efficient-opd-desc">
  <title id="efficient-opd-title">Efficient on-policy distillation</title>
  <desc id="efficient-opd-desc">Six tracks  data, rollout, supervision, optimization, systems, and deployment  feed an evidence ledger that records cost, time, and memory.</desc>
  <rect width="960" height="520" rx="18" fill="#fbf8f8"/>
  <text x="36" y="52" fill="#a45b65" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="2.4">ON-POLICY DISTILLATION</text>
  <text x="36" y="92" fill="#30343b" font-family="Georgia, 'Times New Roman', serif" font-size="32">Six efficiency tracks</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#30343b" text-anchor="middle">
    <g>
      <rect x="36" y="124" width="284" height="92" rx="12" fill="#fff" stroke="#e3dfe1"/>
      <text x="178" y="179">Data</text>
    </g>
    <g>
      <rect x="338" y="124" width="284" height="92" rx="12" fill="#fff" stroke="#e3dfe1"/>
      <text x="480" y="179">Rollout</text>
    </g>
    <g>
      <rect x="640" y="124" width="284" height="92" rx="12" fill="#fff" stroke="#e3dfe1"/>
      <text x="782" y="179">Supervision</text>
    </g>
    <g>
      <rect x="36" y="232" width="284" height="92" rx="12" fill="#fff" stroke="#e3dfe1"/>
      <text x="178" y="287">Optimization</text>
    </g>
    <g>
      <rect x="338" y="232" width="284" height="92" rx="12" fill="#fff" stroke="#e3dfe1"/>
      <text x="480" y="287">Systems</text>
    </g>
    <g>
      <rect x="640" y="232" width="284" height="92" rx="12" fill="#fff" stroke="#e3dfe1"/>
      <text x="782" y="287">Deployment</text>
    </g>
  </g>
  <rect x="36" y="356" width="888" height="128" rx="14" fill="#fff" stroke="#e7d3d6"/>
  <text x="60" y="398" fill="#a45b65" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="2.2">EVIDENCE LEDGER</text>
  <text x="60" y="444" fill="#30343b" font-family="Georgia, 'Times New Roman', serif" font-size="28">Cost · Time · Memory</text>
</svg>

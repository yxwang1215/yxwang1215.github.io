name: Vendor tools codec
on:
  push:
    branches: [feat/tools-compression-modes]
    paths: [scripts/vendor-tools.py, .github/workflows/vendor-tools.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tools-compression-modes
      - name: Download and verify pinned PDF codec
        run: python3 scripts/vendor-tools.py
      - name: Commit only generated codec assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codecs/
          if ! git diff --cached --quiet; then
            git commit -m 'build(tools): vendor integrity-checked PDF codec'
            git push origin HEAD:feat/tools-compression-modes
          fi

name: Consolidate tools preflight
on:
  push:
    branches: [feat/tools-one-workspace-large-ui]
    paths: [scripts/consolidate-tools.py, .github/workflows/consolidate-tools.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tools-one-workspace-large-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show the obsolete routing contract fails
        run: |
          if node --test tests/unified-routes.test.mjs; then
            echo 'Expected the old standalone routes to fail this new test'; exit 1
          fi
      - name: Apply exact reviewed migration
        run: python scripts/consolidate-tools.py
      - name: Syntax and all core regressions
        run: |
          node --check tools/studio.mjs
          node --check tools/pdf-workspace.mjs
          node --check tools/studio-documents.mjs
          node --test tests/*.test.mjs tests/*.test.cjs
          git diff --check
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.64.0 pymupdf==1.28.2 pillow
          python -m playwright install --with-deps chromium
      - name: Same-document navigation, real file outputs and larger layouts
        run: python tests/unified-documents-e2e.py
      - name: Existing zoom, scanner, PDF and compression regression
        run: |
          python tests/browser_check.py
          python tests/scan-styles-e2e.py
      - name: Commit only tested application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Consolidate all tool routes and enlarge the shared editor UI'
          git push origin HEAD:feat/tools-one-workspace-large-ui
      - name: Record inspected source and screenshots
        if: always()
        run: |
          mkdir -p .editor-checks
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('.editor-checks/tested-source.zip','w',zipfile.ZIP_DEFLATED) as out:
            for directory in ['tools','tests']:
              for file in Path(directory).rglob('*'):
                if file.is_file() and file.suffix in ['.mjs','.js','.html','.css','.py','.cjs']:
                  out.write(file)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-tools-preflight
          path: .editor-checks/
          include-hidden-files: true
          retention-days: 7

name: Tools editor check
on:
  push:
    branches: [tools-editor-refresh-20261016, main]
    paths: ['tools/**', 'tests/**', '.github/workflows/tools-editor-check.yml']
  pull_request:
    paths: ['tools/**', 'tests/**', '.github/workflows/tools-editor-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and all core regression tests
        run: |
          node --check tools/studio.mjs
          node --check tools/pdf-workspace.mjs
          node --check tools/studio-compression.mjs
          node --test tests/*.test.mjs tests/*.test.cjs
          python -m py_compile tests/published_browser.py tests/published_smoke.py
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.64.0 pymupdf==1.28.2
          python -m playwright install --with-deps chromium
      - name: Real HTTP browser, worker and PDF regression
        run: python tests/browser_check.py
      - name: Test release smoke script against the checked-out site
        run: |
          python -m http.server 8878 --bind 127.0.0.1 >/tmp/studio-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          STUDIO_SITE_URL=http://127.0.0.1:8878/tools/ python tests/published_browser.py
      - name: Verify published Pages files
        if: github.ref == 'refs/heads/main'
        run: python tests/published_smoke.py
      - name: Verify actual public-domain browser and exports
        if: github.ref == 'refs/heads/main'
        run: python tests/published_browser.py
      - name: Save screenshots, outputs and release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-editor-regression
          path: .editor-checks/
          include-hidden-files: true
          retention-days: 7

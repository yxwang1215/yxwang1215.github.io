name: Tools editor check

on:
  push:
    branches: [tools-editor-refresh-20261016, main]
    paths: ['tools/**', 'tests/studio.test.mjs', 'tests/browser_check.py', '.github/workflows/tools-editor-check.yml']
  pull_request:
    paths: ['tools/**', 'tests/studio.test.mjs', 'tests/browser_check.py', '.github/workflows/tools-editor-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and state regression
        run: |
          node --check tools/studio.mjs
          node --check tools/pdf-workspace.mjs
          node --test tests/studio.test.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Real HTTP browser and PDF regression
        run: python tests/browser_check.py
      - name: Save screenshots and exported fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-editor-regression
          path: .editor-checks/
          include-hidden-files: true
          retention-days: 7

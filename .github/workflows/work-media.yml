name: Prepare publication illustrations
on:
  push:
    branches: [feat/homepage-themed-works-20261017]
    paths:
      - scripts/vendor-work-media.py
      - scripts/work-media-sources.json
      - .github/workflows/work-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: work-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Download and verify original research figures
        run: python scripts/vendor-work-media.py
      - name: Commit only publication media
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/works/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add verified local figures for themed work cards'
            git push origin "HEAD:$TARGET_BRANCH"
          fi

name: Tools quality
on:
  push:
    branches: [feat/tools-compression-modes]
    paths: [tools/**, tests/**, scripts/upgrade-tools.py, scripts/compression-panel.html, .github/workflows/tools-quality.yml]
  pull_request:
    paths: [tools/**, tests/**, .github/workflows/tools-quality.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feat/tools-compression-modes' || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize one-time UI migration
        run: python scripts/upgrade-tools.py
      - name: Core regression tests
        run: node --test tests/scanner-core.test.mjs tests/modes.test.mjs tests/compression.test.mjs
      - name: Browser test dependencies
        run: python -m pip install playwright pillow pymupdf
      - name: Real HTTP-origin browser and export checks
        run: python tests/unified-e2e.py
      - name: Save rendered outputs and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-qa
          path: /tmp/tools-qa
      - name: Commit verified generated UI on the feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/tools-compression-modes'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/index.html tools/png-to-pdf/index.html tools/png-to-pdf/app.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(tools): unify UI and enable one-click scan modes'
            git push origin HEAD:feat/tools-compression-modes
          fi

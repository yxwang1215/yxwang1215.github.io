name: PDF toolkit checks
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/pdf-toolkit*'
      - 'tests/toolkit-routes*'
      - 'tests/png-pdf*'
      - 'tests/scanner-core*'
      - '.github/workflows/pdf-toolkit-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify library checksum
        run: sha256sum -c tools/pdf-kit/pdf-lib.sha256
      - name: Core and original tools regression tests
        run: node --test tests/pdf-toolkit.test.cjs tests/toolkit-routes.test.cjs tests/png-pdf.test.cjs tests/scanner-core.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0 PyMuPDF==1.26.4 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Browser and PDF output tests
        env:
          TEST_OUTPUT: test-results/pdf-toolkit
        run: python tests/pdf-toolkit-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-toolkit-test-results
          path: test-results/pdf-toolkit/
          retention-days: 7

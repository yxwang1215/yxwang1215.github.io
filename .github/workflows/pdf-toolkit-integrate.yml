name: Finalize PDF toolkit preview handling
on:
  push:
    branches: [feat/pdf-toolkit-20261016]
    paths: [.github/workflows/pdf-toolkit-integrate.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply locally verified MIME normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/pdf-kit/app.js')
          s=p.read_text()
          old='url:URL.createObjectURL(file)'
          new="url:URL.createObjectURL(new Blob([file],{type:meta.kind==='pdf'?'application/pdf':'image/png'}))"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('tests/pdf-toolkit-e2e.py')
          s=p.read_text()
          anchor="    check('filenames are text, not executable HTML',page.locator('.source-name').inner_text()==evil and page.locator('.source-name img').count()==0)\n"
          assert anchor in s
          extra='''    page.evaluate("() => {const original=URL.createObjectURL.bind(URL);window.__blobTypes=[];URL.createObjectURL=blob=>{window.__blobTypes.push(blob.type);return original(blob);};}")
              page.locator('#file-input').set_input_files({'name':'disguised.html','mimeType':'text/html','buffer':(FIX/'alpha.pdf').read_bytes()})
              expect(page.locator('#workspace')).to_have_attribute('aria-busy','false')
              check('original preview normalizes untrusted file MIME type',page.evaluate('window.__blobTypes.at(-1)')=='application/pdf')
          '''
          lines=extra.splitlines()
          extra=lines[0]+'\n'+'\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:])+'\n'
          p.write_text(s.replace(anchor,anchor+extra))
          PY
          python -m py_compile tests/pdf-toolkit-e2e.py
          node --test tests/pdf-toolkit.test.cjs tests/toolkit-routes.test.cjs tests/png-pdf.test.cjs tests/scanner-core.test.mjs
      - name: Commit final source and remove temporary write-enabled workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pdf-kit/app.js tests/pdf-toolkit-e2e.py
          git rm .github/workflows/pdf-toolkit-integrate.yml
          git diff --cached --check
          git commit -m 'Normalize local preview MIME types and add regression coverage'
          git push origin HEAD:feat/pdf-toolkit-20261016
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-final-source
          path: |
            tools/
            tests/
            docs/scripts/build-pdf-toolkit-pages.py
            docs/pdf-toolkit.md
            _data/site_directory.yml
          retention-days: 3

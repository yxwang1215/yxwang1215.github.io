name: Site check

on:
  pull_request:
    paths:
      - "**.html"
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "_data/**"
      - "assets/**"
      - "images/works/**"
      - "tests/test_home_works.py"
      - "tests/test_home_experience.py"
      - "tests/talent-atlas.test.cjs"
      - "Gemfile"
      - "Gemfile.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate homepage work catalogue and experience
        run: |
          python tests/test_home_works.py
          python tests/test_home_experience.py
          node --test tests/talent-atlas.test.cjs
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
      - name: Validate rendered homepage and image paths
        run: python tests/test_home_works.py --site _site
      - name: Save built preview for visual checks
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: _site/
          retention-days: 3

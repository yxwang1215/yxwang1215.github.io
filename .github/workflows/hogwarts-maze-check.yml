name: Hogwarts maze integrity

on:
  push:
    paths:
      - "hogwarts/**"
      - "_includes/hogwarts-explorer.html"
      - "assets/js/hogwarts-*.js"
      - "assets/css/hogwarts-explore.css"
      - "assets/css/hogwarts-cinematic.css"
      - "assets/css/hogwarts-soundtrack.css"
      - "assets/images/hogwarts-cinematic*/**"
      - "platform-934/**"
      - "assets/css/hogwarts-map.css"
      - "assets/css/hogwarts-atlas-overview.css"
      - "tests/hogwarts-maze-check.mjs"
      - "tests/hogwarts-map-check.mjs"
      - "tests/hogwarts-soundtrack-check.mjs"
      - "tests/hogwarts-scenes-check.mjs"
      - "tests/hogwarts-explorer-check.mjs"
      - "tests/hogwarts-geography-check.mjs"
      - ".github/workflows/hogwarts-maze-check.yml"
  pull_request:
    paths:
      - "hogwarts/**"
      - "_includes/hogwarts-explorer.html"
      - "assets/js/hogwarts-*.js"
      - "assets/css/hogwarts-explore.css"
      - "assets/css/hogwarts-cinematic.css"
      - "assets/css/hogwarts-soundtrack.css"
      - "assets/images/hogwarts-cinematic*/**"
      - "platform-934/**"
      - "assets/css/hogwarts-map.css"
      - "assets/css/hogwarts-atlas-overview.css"
      - "tests/hogwarts-maze-check.mjs"
      - "tests/hogwarts-map-check.mjs"
      - "tests/hogwarts-soundtrack-check.mjs"
      - "tests/hogwarts-scenes-check.mjs"
      - "tests/hogwarts-explorer-check.mjs"
      - "tests/hogwarts-geography-check.mjs"
      - ".github/workflows/hogwarts-maze-check.yml"
  workflow_dispatch:

jobs:
  graph-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check expansion manifest, secret artwork and new static routes
        run: node tests/hogwarts-expansion-check.mjs
      - name: Check route graph and static pages
        run: node tests/hogwarts-maze-check.mjs
      - name: Check Hogwarts parchment map
        run: node tests/hogwarts-map-check.mjs
      - name: Check public atlas, geography evidence and routes
        run: node tests/hogwarts-geography-check.mjs
      - name: Check soundtrack routes and scene transitions
        run: node tests/hogwarts-soundtrack-check.mjs
      - name: Check actual scene assets and passage coordinates
        run: node tests/hogwarts-scenes-check.mjs
      - name: Check explorer movement, secrets and image recovery
        run: node tests/hogwarts-explorer-check.mjs

name: Hogwarts maze integrity

on:
  push:
    paths:
      - "hogwarts/**"
      - "_includes/hogwarts-explorer.html"
      - "assets/js/hogwarts-*.js"
      - "assets/css/hogwarts-explore.css"
      - "assets/css/hogwarts-map.css"
      - "tests/hogwarts-maze-check.mjs"
      - "tests/hogwarts-map-check.mjs"
      - "tests/hogwarts-soundtrack-check.mjs"
      - ".github/workflows/hogwarts-maze-check.yml"
  pull_request:
    paths:
      - "hogwarts/**"
      - "_includes/hogwarts-explorer.html"
      - "assets/js/hogwarts-*.js"
      - "assets/css/hogwarts-explore.css"
      - "assets/css/hogwarts-map.css"
      - "tests/hogwarts-maze-check.mjs"
      - "tests/hogwarts-map-check.mjs"
      - "tests/hogwarts-soundtrack-check.mjs"
      - ".github/workflows/hogwarts-maze-check.yml"
  workflow_dispatch:

jobs:
  graph-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check route graph and static pages
        run: node tests/hogwarts-maze-check.mjs
      - name: Check Hogwarts parchment map
        run: node tests/hogwarts-map-check.mjs
      - name: Check soundtrack routes and scene transitions
        run: node tests/hogwarts-soundtrack-check.mjs

name: Assemble and verify PDF toolkit
on:
  push:
    branches: [feat/pdf-toolkit-20261016]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned library and generate standalone pages
        run: |
          sha256sum -c tools/pdf-kit/pdf-lib.sha256
          python docs/scripts/build-pdf-toolkit-pages.py
      - name: Core and legacy regression tests
        run: node --test tests/pdf-toolkit.test.cjs tests/toolkit-routes.test.cjs tests/png-pdf.test.cjs tests/scanner-core.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0 PyMuPDF==1.26.4 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Test real HTTP, CSP, worker imports and PDF downloads
        env:
          TEST_OUTPUT: test-results/pdf-toolkit
        run: python tests/pdf-toolkit-e2e.py
      - name: Commit generated pages on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/index.html tools/mixed-to-pdf/index.html tools/merge-pdf/index.html tools/split-pdf/index.html tools/extract-pdf/index.html tools/organize-pdf/index.html tools/png-to-pdf-simple/index.html
          git diff --cached --quiet || git commit -m 'Generate verified standalone PDF toolkit pages and preserve original converter'
          git push origin HEAD:feat/pdf-toolkit-20261016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-toolkit-verified
          path: |
            tools/
            tests/
            docs/scripts/build-pdf-toolkit-pages.py
            docs/pdf-toolkit.md
            test-results/pdf-toolkit/
          retention-days: 3

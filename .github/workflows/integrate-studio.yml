name: Integrate studio with concurrent tool updates
on:
  push:
    branches: [tools-editor-refresh-20261016]
    paths: [.github/workflows/integrate-studio.yml, scripts/integrate-studio.py]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools-editor-refresh-20261016
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge only the inspected main revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'c1f553e7f96bbd6fc4b7ba13247b9ade6e65c2e2'
          if ! git merge --no-commit --no-ff origin/main; then
            test "$(git diff --name-only --diff-filter=U)" = 'tools/index.html'
            git checkout --ours -- tools/index.html
          fi
          python scripts/integrate-studio.py
          git add tools/index.html tools/studio.mjs tools/studio-utils.mjs tests/browser_check.py .github/workflows/tools-quality.yml
          git diff --check --cached
      - name: All core and integration regression tests
        run: |
          node --check tools/studio.mjs
          node --check tools/studio-compression.mjs
          node --check tools/pdf-workspace.mjs
          node --test tests/*.test.mjs tests/*.test.cjs
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.64.0 pymupdf==1.28.2 pillow
          python -m playwright install --with-deps chromium
      - name: Real HTTP, worker, PDF and compression tests
        run: python tests/browser_check.py
      - name: Commit tested merge without force
        run: |
          git commit -m 'Integrate concurrent codecs and adaptive modes into the unified studio'
          git push origin HEAD:tools-editor-refresh-20261016
      - name: Save actual browser screenshots and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-studio-qa
          path: .editor-checks/
          include-hidden-files: true
          retention-days: 7

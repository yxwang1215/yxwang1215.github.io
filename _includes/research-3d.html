<!-- Decorative, generative research visual; not a visualization of experimental data. -->
<section class="research-3d" id="research-3d" aria-labelledby="research-3d-title">
  <div class="research-3d__intro">
    <span class="research-3d__eyebrow"><span aria-hidden="true">✳</span> A LITTLE EXPLORATION</span>
    <h2 id="research-3d-title">Intelligence,<br><em>in motion.</em></h2>
    <p class="research-3d__lede">Finding the structure behind<br>efficient, multimodal AI.</p>
    <a class="research-3d__link" href="#publications">Explore my research <span aria-hidden="true">↗</span></a>
    <div class="research-3d__index" aria-hidden="true"><span data-r3d-index>01</span><span class="research-3d__index-line"></span><span>03</span></div>
  </div>
  <div class="research-3d__visual">
    <div class="research-3d__topline"><span>THE SHAPE OF AN IDEA</span><span class="research-3d__state" data-r3d-state>GENERATIVE STUDY</span></div>
    <div class="research-3d__stage">
      <svg class="research-3d__fallback" viewBox="0 0 480 340" aria-hidden="true" focusable="false">
        <defs><linearGradient id="r3d-fallback-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c72e8"/><stop offset=".55" stop-color="#7c6fe8"/><stop offset="1" stop-color="#d06bdb"/></linearGradient></defs>
        <g fill="none" stroke="url(#r3d-fallback-ink)" stroke-width=".8" transform="translate(240 166)">
          <circle r="108"/><ellipse rx="35" ry="108"/><ellipse rx="72" ry="108"/>
          <ellipse rx="108" ry="28"/><ellipse rx="108" ry="63"/><ellipse rx="108" ry="90"/>
          <ellipse rx="144" ry="39" transform="rotate(-28)"/><ellipse rx="133" ry="43" transform="rotate(38)"/>
        </g>
        <g><circle cx="132" cy="166" r="3" fill="#4c72e8"/><circle cx="276" cy="64" r="3" fill="#7c6fe8"/><circle cx="312" cy="246" r="3" fill="#d06bdb"/></g>
      </svg>
      <canvas class="research-3d__canvas" tabindex="0" role="img" aria-label="Interactive 3D neural sphere" aria-describedby="research-3d-help" hidden></canvas>
      <span class="research-3d__corner research-3d__corner--tl" aria-hidden="true"></span>
      <span class="research-3d__corner research-3d__corner--br" aria-hidden="true"></span>
      <span class="research-3d__axis" aria-hidden="true">x &nbsp;·&nbsp; y &nbsp;·&nbsp; z</span>
    </div>
    <div class="research-3d__caption"><span data-r3d-name>Neural constellation</span><span id="research-3d-help">A generative study, not a data plot.</span></div>
    <div class="research-3d__controls" hidden>
      <div class="research-3d__modes" role="group" aria-label="Choose a 3D shape">
        <button type="button" data-r3d-mode="0" aria-pressed="true"><span aria-hidden="true">01</span> Neural</button>
        <button type="button" data-r3d-mode="1" aria-pressed="false"><span aria-hidden="true">02</span> Audio</button>
        <button type="button" data-r3d-mode="2" aria-pressed="false"><span aria-hidden="true">03</span> KV orbit</button>
      </div>
      <div class="research-3d__actions">
        <button type="button" data-r3d-pause aria-label="Pause animation" aria-pressed="false" title="Pause animation">Ⅱ</button>
        <button type="button" data-r3d-reset aria-label="Reset 3D view" title="Reset 3D view">↺</button>
      </div>
    </div>
    <span class="research-3d__sr" data-r3d-announcement role="status" aria-live="polite"></span>
  </div>
</section>

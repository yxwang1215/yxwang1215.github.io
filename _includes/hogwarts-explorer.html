  <style>html:not([data-hgw-authorized="true"]){visibility:hidden;background:#0b141b}</style>
  <script src="/assets/js/hogwarts-atlas.js?v=20261022-maze-v3"></script>
  <script>
    (function(){
      "use strict";
      var passKey="hogwarts:platform934:pass:v1";
      var sessionKey="hogwarts:session:v2";
      var path=window.location.pathname.replace(/index\.html$/i,"").replace(/\/+$/,"")+"/";
      var atlas=window.HogwartsAtlas;
      var roomId=atlas&&atlas.byPath[path];
      var allowed=false,now=Date.now();
      try{
        var raw=window.sessionStorage.getItem(passKey);
        window.sessionStorage.removeItem(passKey);
        var ticket=raw?JSON.parse(raw):null;
        var ticketAge=ticket?now-ticket.at:-1;
        if(path==="/hogwarts/"&&roomId==="gate"&&ticket&&ticket.from==="/platform-934/"&&
           typeof ticket.at==="number"&&ticketAge>=0&&ticketAge<=60000&&
           typeof ticket.nonce==="string"&&/^[a-f0-9]{32}$/.test(ticket.nonce)){
          window.sessionStorage.setItem(sessionKey,JSON.stringify({
            id:ticket.nonce,issued:now,current:path,visited:["gate"]
          }));
          allowed=true;
        }
        if(!allowed&&roomId){
          var previous=JSON.parse(window.sessionStorage.getItem(sessionKey)||"null");
          var age=previous?now-previous.issued:-1;
          allowed=!!(previous&&typeof previous.id==="string"&&/^[a-f0-9]{32}$/.test(previous.id)&&
            typeof previous.issued==="number"&&age>=0&&age<=21600000&&
            Array.isArray(previous.visited)&&previous.visited.indexOf(roomId)!==-1);
        }
      }catch(error){allowed=false}
      if(!allowed){window.location.replace("/");return}
      document.documentElement.setAttribute("data-hgw-authorized","true");
    })();
  </script>

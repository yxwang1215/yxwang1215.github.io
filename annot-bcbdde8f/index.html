<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>510(k) 标注台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky task bar, item rail on the left, one item at a time on the right; stacks on phones. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2321; --muted:#5f6b66; --line:#d8ddd9;
  --accent:#1f6f5c; --accent-soft:#dcefe8; --mark:#fff0b3; --warn:#9a5b00; --bad:#a33a2b;
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a201e; --fg:#e4ebe7; --muted:#9aa8a2; --line:#2e3734;
  --accent:#5cc2a4; --accent-soft:#1d3a31; --mark:#5a4a12; --warn:#e3a54a; --bad:#ec8a7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a201e; --fg:#e4ebe7; --muted:#9aa8a2; --line:#2e3734;
  --accent:#5cc2a4; --accent-soft:#1d3a31; --mark:#5a4a12; --warn:#e3a54a; --bad:#ec8a7b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--fg);padding:5px 12px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.status{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.status.err{color:var(--bad)}
main .wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding-block:18px 48px}
@media (max-width:760px){main .wrap{grid-template-columns:minmax(0,1fr)} .rail{max-height:150px}}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 120px);position:sticky;top:70px;align-self:start}
.rail button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:13px var(--mono);padding:6px 10px;cursor:pointer;text-align:left}
.rail button[aria-current="true"]{background:var(--accent-soft)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);align-self:center}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.part{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.guide{font-size:14px;color:var(--muted);margin:0 0 14px;max-width:72ch}
.guide b{color:var(--fg)}
.eyebrow{font:12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h2{font-size:18px;margin:2px 0 6px;text-wrap:balance}
a{color:var(--accent)}
.pass{font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;overflow-wrap:anywhere;max-height:260px;overflow:auto}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px;font-family:var(--mono);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
.tblwrap{overflow-x:auto;margin-top:12px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em}
td.k{font-family:var(--mono);white-space:nowrap}
td.nm{color:var(--muted);min-width:140px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{padding:4px 10px;cursor:pointer;font-size:13px;white-space:nowrap;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:600}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols h3{font-size:14px;margin:0 0 4px}
.cols .pass{max-height:none}
.q{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.q span.t{min-width:0;flex:1 1 240px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
textarea{width:100%;box-sizing:border-box;min-height:52px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;padding:6px 8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);padding:7px 16px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);padding:30px 0}
.banner{background:var(--accent-soft);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.banner.err{color:var(--bad)}
kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px}

.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.who input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;width:9em}
.btn.sm{padding:4px 10px;font-size:13px}
</style>
</head><body>
<header><div class="wrap">
  <h1>510(k) 标注台</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-gold" aria-selected="true">任务一 · 先例核对 <span id="cnt-gold"></span></button>
    <button class="tab" role="tab" id="tab-ifu" aria-selected="false">任务二 · 用途比对 <span id="cnt-ifu"></span></button>
  </div>
  <div class="who"><label for="who">标注人</label><input id="who" placeholder="填你的名字">
    <button class="btn sm" id="export">导出标注</button><label class="btn sm ghost" for="imp" style="cursor:pointer">导入</label>
    <input type="file" id="imp" accept=".json" hidden></div>
  <div class="status" id="status"></div>
</div></header>

<main><div class="wrap">
  <nav class="rail" id="rail" aria-label="题目列表"></nav>
  <section class="card" id="card"><div class="empty">正在加载题目…</div></section>
</div></main>

ructure whereas the predicate device is pressed over metals and includes an additional indicati …", "… r the fundamental intended use of the devices as ceramic materials for the fabrication of dental restorations. Therefore, the indications for use of the subject device are substantially equivalent to the predicate device. TECHNOLOGICAL COMPARISON (21 CFR 807.92(a)(6)) The subject device, Obsidian® Press Over Zirconia, is substantially equivalent in technological characteristics to the predicate device, Obsidian® Press (All-Ceramic and POM) (K141887) in terms of overall design principles, material and performance. The subject device, Obsidian® Press Over Zirconia, is similar in terms of overall design to the predicate device, Obsidian® Press (All-Ceramic and POM) (K141887). Both devices are ceramic ingots intended for use in the fabrication of dental restorations using a hot-press technique. The predicate device, Obsidian® Press (All-Ceramic and POM), is used in Press Over Metal (POM) applications in addition to the all-ceramic applications whereas the subject device, Obsidian® Press Over Zirconia, is used in Press Over Zirconia (POZ) applications. Although subject device, Obsidian® Press Over Zirconia, and the predicate device, Obsidian® Press (All-Ceramic and POM) (K141887), differ in material composition, with the predicate device consisting of a fully crystallized lithium silicate glass-ceramic and the subject device consisting of a fully crystallized lithium disilicate glass-ceramic, the fundamental principle of operation remains the same. Both devices are supplied as fully crystalized glass-ceramic ingots that are hot-pressed into an investment mold using conventional dental laboratory hot-pressing techni …", "… tal restoration applications. Therefore, the difference in the underlying framework material does not alter the device’s fundamental scientific technology or principle of operation. Prismatik Dentalcraft, Inc. 510(k) Notification Obsidian® Press Over Z ZER II AND II -I SERIES"}], "passages": ["… ed States Correspondent Contact Telephone: +1 925-413-8108 Correspondent Contact: Ms. Marysa Lyew Correspondent Contact Email: marysa.lyew@zeiss.com 2.0 Device Name Device Trade Name: ZEISS Clinic 360 Common Name: ZEISS Clinic 360 Classification Name: Ophthalmic Regulation Number: 892.2050 Product Code(s): NFJ 3.0 Legally Marketed Predicate Devices Predicate # - Predicate Tade Name (Primary Predicate is listed first) – Product Code K232555 – Harmony – NFJ K233933 – CIRRUS™ HD-OCT Model 6000 – OBO K093213 – GPA on the HUMPHREY FIELD ANALYZER II & II-I Series – HPT 4.0 Device Description Summary ZEISS CLINIC 360 is a browser-based software designed to consolidate, process, analyze and display patient medical and diagnostic data. It integrates data stored in the Health Data Platform K260694 K260694 - 510(k) Summary Page 2 of 13 ZEISS classification: Restricted (HDP) allowing users to access and review comprehensive diagnostic information. HDP is a separate non-medical device platform that will support CLINIC 360. The Health Data Platform (HDP) provides a workflow enabling bi-directional data flow between medical devices or health record systems with cloud-based clinical and administrative applications. ZEISS CLINIC 360 builds upon feature sets available in CIRRUS (K233933) and HFA (K093213) by leveraging raw data analyses and integrating the data into one integrated multimodal view. ZEISS CLINIC 360 implements CIRRUS algorithms (OCT Analyzer) and reference databases for macular thickness, retinal nerve fiber layer thickness, ganglion cell plus inner plexiform thickness, optic nerve head measurement. CLINIC 360 also implements Humphrey Field Analyzer (HFA) algorithms and databases for visual field measurements and Visual Field …", "… urement, analysis and storage of clinical images and videos of the eye as well as in management and display of patient data, diagnostic data, clinical information, and reports from ophthalmic diagnostic instruments through computerized networks. The device aids in the detection, monitoring and management of various ocular diseases. 6.0 Indications for Use Comparison The subject device (ZEISS CLINIC 360) and the predicate device (Harmony;K232555) are both comprehensive software intended for use in importing, processing, measurement, analysis and storage of clinical images and videos of the eye as well as in management and display of patient data, diagnostic data, clinical information, and reports from ophthalmic diagnostic instruments through computerized networks. They are both Cloud (browser based) DICOM-enabled devices that are IEC 62304 Compliant. 7.0 Technological Comparison ZEISS CLINIC 360 builds upon feature sets available in CIRRUS (K233933) and Humphrey Field Analyzer (K093213) by leveraging raw data analyses and integrating the data into one integrated multimodal view. ZEISS CLINIC 360 implements CIRRUS algorithms (OCT K260694 K260694 - 510(k) Summary Page 6 of 13 ZEISS classification: Restricted Analyzer) and reference databases, as well as algorithms and databases from HFA for visual field measurements and Visual Field Guided Progression Analysis. The technological characteristics and risk profile of the subject device (ZEISS CLINIC 360) are equivalent in their relationship to safety and effectiveness to the predicate device (Harmony; K232555) and the listed reference devices (CIRRUS; K233933) and (HFA; K093213). Therefore, the subject device can be determined to be substantially equivalent to the predicate. The Substantial Equivalence Table for the Subject Device and its Primary Predicates and Reference Devices is provided below: K260694 K260694 - 510(k) Summary Page 7 of 13 ZEISS classification: Restricted Substantial Equivalence of ZEISS Clinic 360 to Predicate(s) Attributes / Specifications Subject Device: Clinic 360 v. 1.0 (KTBD) Predicate Device: Harmony (K232555) Reference Device 1: Cirrus HD-OCT 6000 v.11.7 (K233933) Reference Device 2: H se cleared in K243277. This will provide the surgeons with the full portfolio of Freedom® bearing surfaces with a higher wear resistance. Surgeons will be able to use the same instruments/surgical technique to the Freedom® Total Knee System. The Freedom® Total Knee System is indicated for the following: • Severe knee joint pain, loss of mobility, and disability due to: rheumatoid arthritis, osteoarthritis, traumatic arthritis, polyarthritis. • Correction of functi …", "… etaphyseal Cones are additionally indicated for use in addressing tibial bone voids and/or metaphyseal reconstruction. Indications for use are the same. The E-Poly Tibial implants have been developed with the desire to expand upon the already clinically successful Freedom® Total Knee System by introducing a Vitamin E crosslinked material. The implants will retain the exact design features and geometries of the All-Poly Tibial implant system (K082019, K250382) and the modular, metal-backed systems (K090411, K182574, K243277). The implants will be manufactured in GUR 1020-E UHMPE containing 0.1% Vitamin E; this is equivalent to the material in reference device K192989 for the Libertas E-XPLE Modular Liners. This combination will maintain the previous design outputs of the Freedom Knee System while eliminating the oxidation causing radical in the GUR 1020. The new Tibial implants are designed the same as the existing All-Poly and modular, metal-backed Freedom® system components with identical profiles, size ranges, and articular surface types. The Cruciate-Retaining articular surface is identical to those cleared in K082019, the Posterior-Stabilized articular surface is identical to those cleared in K082019, the Ultracongruent articular surface is identical to those cleared in K182574, and the Medial Congruent articular surface is identical to those cleared in K243277. This will provide the surgeons with the full portfolio of Freedom® bearing surfaces. Surgeons will be able to use the same instruments/ 1083). Both are software-only, Class II (21 CFR 892.2050) medical devices cleared under product codes QIH and LLZ, operate on off-the-shelf hardware, are DICOM-compliant, and provide only adjunctive information to clinicians. Neither device applies energy to the patient or has any physical, electrical, mechanical, chemical, thermal, or radiation output, and biocompatibility and sterility are not applicable to either. In terms of core functionalit …", "… e lead model; 6. Are software-only, hardware-agnostic solutions that require no proprietary local installation or specialized hardware to perform their intended medical function; 7. KequIre user authentIcatIon and logon; 8. Provide adjunctive information only- neither device performs surgical guidance, DBS programming, or VT A modeling. The technological characteristics carried over from the predecessor Quicktome Software Suite clearance (K222359) are unchanged in the subject device. These include DWI-based constrained-spherical-deconvolution (CSD) tractography, resting-state fMRI correlation mapping for motor, language, and vision networks, cortical atlas-assisted visualization using a modified Glasser/HCP-MMP1 atlas, network templates and tractography bundles, target export generation, the three-tier cloud architecture (browser-based Web Viewer, on-premises Gateway for PACS integration and de-identification, and a cloud Processing Core), and two-factor user authentication. These features are configurable per facility and were not modified for this submission; their equivalence was confirmed by comparison testing against Quicktome (K222359). Two technological differences are identified between the subject device and the primary predicate. Neither raises new or different questions of safety or effectiveness, for the reasons summarized below; each was verified and validated and did not lead to any additional questions of safety or effectiveness. Difference 1: Segmentation algorithm The predicate generates anatomical o <script>
const S = { items: { gold: [], ifu: [] }, tab: "gold", idx: { gold: 0, ifu: 0 }, labels: { gold: {}, ifu: {} }, db: null, ref: null, dirty: false, saving: false };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const GOLD_OPTS = [["pred", "先例"], ["ref", "参考器械"], ["other", "其他"]];
const IFU_QS = [
  ["anatomy", "用在同一个身体部位 / 器官吗？"],
  ["condition", "针对同一种疾病、症状或测量对象吗？"],
  ["purpose", "目的相同吗（治疗 / 诊断 / 监测 / 辅助操作）？"],
  ["population", "适用人群一样吗（成人、儿童、特定患者）？"],
  ["setting", "使用场景一样吗（医院、诊所、家用）？"],
];
const YN = [["yes", "是"], ["no", "否"], ["unclear", "看不出"]];
const OVERALL = [["same", "相同"], ["partial", "部分相同"], ["diff", "不同"]];

function status(t, err) { const el = $("#status"); el.textContent = t; el.classList.toggle("err", !!err); }
function store() { try { localStorage.setItem("fda-annot-draft", JSON.stringify(S.labels)); } catch (e) {} }
function draft() { try { return JSON.parse(localStorage.getItem("fda-annot-draft") || "null"); } catch (e) { return null; } }

function isDone(tab, it) {
  const L = S.labels[tab][it.id];
  if (!L) return 0;
  if (tab === "gold") { const n = it.ks.filter((x) => L[x.k]).length; return n === it.ks.length ? 2 : n ? 1 : 0; }
  const n = IFU_QS.filter(([q]) => L[q]).length + (L.overall ? 1 : 0);
  return n === IFU_QS.length + 1 ? 2 : n ? 1 : 0;
}
function counts() {
  for (const tab of ["gold", "ifu"]) {
    const xs = S.items[tab];
    $("#cnt-" + tab).textContent = xs.length ? `${xs.filter((it) => isDone(tab, it) === 2).length}/${xs.length}` : "（准备中）";
  }
}
function rail() {
  const xs = S.items[S.tab];
  $("#rail").innerHTML = xs.map((it, i) => {
    const d = isDone(S.tab, it);
    return `<button data-i="${i}" aria-current="${i === S.idx[S.tab]}"><span>${String(i + 1).padStart(3, "0")} ${esc(S.tab === "gold" ? it.k : it.k)}</span><span class="dot ${d === 2 ? "done" : d ? "part" : ""}"></span></button>`;
  }).join("") || `<div class="empty" style="padding:12px">暂无题目</div>`;
}
function seg(name, opts, val) {
  return `<span class="seg">${opts.map(([v, t]) => `<label><input type="radio" name="${esc(name)}" value="${v}" ${val === v ? "checked" : ""}><span>${t}</span></label>`).join("")}</span>`;
}
function hl(text, ks) {
  let s = esc(text);
  for (const k of ks) s = s.split(k).join(`<mark>${k}</mark>`);
  return s;
}
function nav(n) {
  return `<div class="row"><button class="btn ghost" id="prev">上一题</button><button class="btn" id="next">下一题</button>
  <span style="color:var(--muted);font-size:13px">第 ${S.idx[S.tab] + 1} / ${n} 题 · 快捷键 <kbd>←</kbd> <kbd>→</kbd> · 自动保存在本浏览器，做完点「导出标注」</span></div>`;
}
function render() {
  counts(); rail();
  const xs = S.items[S.tab], it = xs[S.idx[S.tab]], card = $("#card");
  const banner = "";
  if (!it) {
    card.innerHTML = banner + `<div class="empty">${S.tab === "ifu" ? "任务二的题目还在生成（等模型候选器械的 PDF 下载完成），完成后会出现在这里。可以先做任务一。" : "暂无题目。"}</div>`;
    return;
  }
  const L = S.labels[S.tab][it.id] || {};
  if (S.tab === "gold") {
    card.innerHTML = banner + `
      <p class="guide">读下面摘录的 510(k) 摘要原文，给文中出现的每个 K 号选一个类别。<b>先例</b>：文中说新器械与它实质等同（包括 primary predicate 和 additional / secondary predicate）。<b>参考器械</b>：文中称为 reference device，或只用来对比某个测试或参数。<b>其他</b>：只是顺带提到，例如新器械自己的旧版本申请号或无关文件。摘录看不清时，打开原 PDF 查看。</p>
      <div class="eyebrow">${esc(it.k)} · 新器械</div>
      <h2>${esc(it.device)}</h2>
      <a href="${esc(it.pdf)}" target="_blank" rel="noopener">在 FDA 网站打开原 PDF ↗</a>
      ${it.passages.map((p) => `<div class="pass">${hl(p, it.ks.map((x) => x.k))}</div>`).join("")}
      <div class="tblwrap"><table><thead><tr><th>K 号</th><th>数据库中的器械名</th><th>类别</th></tr></thead><tbody>
      ${it.ks.map((x) => `<tr><td class="k">${x.k}</td><td class="nm">${esc(x.name) || "—"}</td><td>${seg(it.id + "|" + x.k, GOLD_OPTS, L[x.k])}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="row" style="flex-direction:column;align-items:stretch"><label for="note">备注（可选：拿不准的原因、摘录缺了什么）</label><textarea id="note">${esc(L._note || "")}</textarea></div>
      ${nav(xs.length)}`;
  } else {
    card.innerHTML = banner + `
      <p class="guide">左边是新器械的适用范围（IFU），右边是数据库里一个更早的器械。只按字面比较两段文字，逐项回答，不需要医学知识；文字里没写的选<b>看不出</b>。最后给一个整体判断。</p>
      <div class="cols">
        <div><div class="eyebrow">新器械</div><h3>${esc(it.new_name)}</h3><div class="pass">${esc(it.new_ifu)}</div></div>
        <div><div class="eyebrow">对比器械 · ${esc(it.other)}</div><h3>${esc(it.other_name)}</h3><div class="pass">${esc(it.other_ifu)}</div></div>
      </div>
      ${IFU_QS.map(([q, t]) => `<div class="q"><span class="t">${t}</span>${seg(it.id + "|" + q, YN, L[q])}</div>`).join("")}
      <div class="q"><span class="t"><b>整体：两者的用途是否相同？</b></span>${seg(it.id + "|overall", OVERALL, L.overall)}</div>
      <div class="row" style="flex-direction:column;align-items:stretch"><label for="note">备注（可选）</label><textarea id="note">${esc(L._note || "")}</textarea></div>
      ${nav(xs.length)}`;
  }
}
function setLabel(field, val) {
  const it = S.items[S.tab][S.idx[S.tab]];
  const L = (S.labels[S.tab][it.id] ||= {});
  if (val === "" || val == null) delete L[field]; else L[field] = val;
  L._t = Date.now();
  S.dirty = true; store(); counts(); rail(); save();
}
function save() { status("已自动保存在本浏览器 " + new Date().toLocaleTimeString() + " · 做完请点「导出标注」"); }
function go(d) {
  const n = S.items[S.tab].length; if (!n) return;
  S.idx[S.tab] = Math.max(0, Math.min(n - 1, S.idx[S.tab] + d)); render(); window.scrollTo({ top: 0 });
}
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.type === "radio") { const [, f] = t.name.split("|"); setLabel(f, t.value); }
});
document.addEventListener("input", (e) => { if (e.target.id === "note") setLabel("_note", e.target.value); });
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "next") go(1); else if (b.id === "prev") go(-1);
  else if (b.dataset.i != null) { S.idx[S.tab] = +b.dataset.i; render(); }
  else if (b.id === "tab-gold" || b.id === "tab-ifu") {
    S.tab = b.id.slice(4);
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === b));
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
});


function who() { return ($("#who").value || "").trim(); }
document.addEventListener("input", (e) => { if (e.target.id === "who") { try { localStorage.setItem("fda-annot-who", who()); } catch (x) {} } });
document.addEventListener("click", (e) => {
  if (e.target.id !== "export") return;
  if (!who()) { status("请先在右上角填写标注人名字", true); $("#who").focus(); return; }
  const blob = new Blob([JSON.stringify({ annotator: who(), exportedAt: new Date().toISOString(), gold: S.labels.gold, ifu: S.labels.ifu })], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `fda510k_labels_${who()}.json`; document.body.appendChild(a); a.click(); a.remove();
  status("已导出，把下载的 JSON 文件发回即可");
});
document.addEventListener("change", (e) => {
  if (e.target.id !== "imp" || !e.target.files[0]) return;
  e.target.files[0].text().then((t) => {
    const d = JSON.parse(t);
    for (const tab of ["gold", "ifu"]) Object.assign(S.labels[tab], d[tab] || {});
    if (d.annotator && !who()) $("#who").value = d.annotator;
    store(); render(); status("已导入 " + (d.annotator || ""));
  }).catch(() => status("导入失败：文件不是导出的标注 JSON", true));
});
(function boot() {
  const d = JSON.parse(document.getElementById("items").textContent);
  S.items.gold = d.gold || []; S.items.ifu = d.ifu || [];
  const dr = draft(); if (dr) S.labels = { gold: dr.gold || {}, ifu: dr.ifu || {} };
  try { $("#who").value = localStorage.getItem("fda-annot-who") || ""; } catch (x) {}
  const first = (tab) => Math.max(0, S.items[tab].findIndex((it) => isDone(tab, it) < 2));
  S.idx.gold = first("gold"); S.idx.ifu = first("ifu");
  status("标注自动保存在本浏览器；换电脑或清缓存前请先导出");
  render();
})();
</script>
</body></html>
